<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramo de flores amarillas</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #fffdf5;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.container {
    width: 500px;
    max-width: 95vw;
    text-align: center;
}

h1 {
    color: #d89b00;
    opacity: 0;
    animation: aparecer 1s ease forwards;
    animation-delay: 7s;
}

/* SVG */
svg {
    width: 100%;
    height: auto;
}

/* Líneas que simulan el dibujo */
.dibujo {
    fill: none;
    stroke: #4f8f3b;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;

    stroke-dasharray: 500;
    stroke-dashoffset: 500;

    animation: dibujar 2s ease forwards;
}

/* Tallos */
.tallo1 {
    animation-delay: 0.5s;
}

.tallo2 {
    animation-delay: 1s;
}

.tallo3 {
    animation-delay: 1.5s;
}

.tallo4 {
    animation-delay: 2s;
}

.tallo5 {
    animation-delay: 2.5s;
}

/* Hojas */
.hoja {
    fill: #69a84f;
    stroke: #3d7430;
    stroke-width: 2;

    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;

    animation: aparecerHoja 0.8s ease forwards;
}

.hoja1 { animation-delay: 2.8s; }
.hoja2 { animation-delay: 3.2s; }
.hoja3 { animation-delay: 3.6s; }
.hoja4 { animation-delay: 4s; }
.hoja5 { animation-delay: 4.4s; }

/* Flores */
.flor {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;

    animation: aparecerFlor 1s ease forwards;
}

.flor1 { animation-delay: 4.7s; }
.flor2 { animation-delay: 5.1s; }
.flor3 { animation-delay: 5.5s; }
.flor4 { animation-delay: 5.9s; }
.flor5 { animation-delay: 6.3s; }

/* Pétalos */
.petalo {
    fill: #ffd83d;
    stroke: #e0a900;
    stroke-width: 2;
}

/* Centro de las flores */
.centro {
    fill: #8f6500;
}

/* Papel del ramo */
.papel {
    fill: #f3d8a0;
    stroke: #c9a86a;
    stroke-width: 3;

    opacity: 0;
    animation: aparecerPapel 1s ease forwards;
    animation-delay: 6.7s;
}

/* Animaciones */

@keyframes dibujar {
    to {
        stroke-dashoffset: 0;
    }
}

@keyframes aparecerHoja {
    from {
        opacity: 0;
        transform: scale(0);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes aparecerFlor {
    from {
        opacity: 0;
        transform: scale(0) rotate(-20deg);
    }

    to {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}

@keyframes aparecerPapel {
    from {
        opacity: 0;
        transform: translateY(40px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes aparecer {
    to {
        opacity: 1;
    }
}
</style>
</head>

<body>

<div class="container">

<svg viewBox="0 0 500 600">

    <!-- Tallos -->
    <path class="dibujo tallo1"
          d="M250 500 C245 420 180 300 130 150"/>

    <path class="dibujo tallo2"
          d="M255 500 C255 410 245 280 220 110"/>

    <path class="dibujo tallo3"
          d="M260 500 C270 410 330 270 360 120"/>

    <path class="dibujo tallo4"
          d="M250 500 C220 400 150 330 85 250"/>

    <path class="dibujo tallo5"
          d="M260 500 C300 400 390 340 420 230"/>


    <!-- Hojas -->

    <ellipse class="hoja hoja1"
             cx="175" cy="335"
             rx="15" ry="45"
             transform="rotate(-45 175 335)"/>

    <ellipse class="hoja hoja2"
             cx="215" cy="300"
             rx="15" ry="48"
             transform="rotate(-20 215 300)"/>

    <ellipse class="hoja hoja3"
             cx="310" cy="330"
             rx="15" ry="48"
             transform="rotate(35 310 330)"/>

    <ellipse class="hoja hoja4"
             cx="145" cy="390"
             rx="14" ry="42"
             transform="rotate(-60 145 390)"/>

    <ellipse class="hoja hoja5"
             cx="350" cy="390"
             rx="14" ry="45"
             transform="rotate(55 350 390)"/>


    <!-- FLORES -->

    <!-- Flor 1 -->
    <g class="flor flor1" transform="translate(130 150)">
        <ellipse class="petalo" rx="22" ry="42" transform="rotate(0)"/>
        <ellipse class="petalo" rx="22" ry="42" transform="rotate(60)"/>
        <ellipse class="petalo" rx="22" ry="42" transform="rotate(120)"/>
        <circle class="centro" r="18"/>
    </g>

    <!-- Flor 2 -->
    <g class="flor flor2" transform="translate(220 110)">
        <ellipse class="petalo" rx="22" ry="42" transform="rotate(0)"/>
        <ellipse class="petalo" rx="22" ry="42" transform="rotate(60)"/>
        <ellipse class="petalo" rx="22" ry="42" transform="rotate(120)"/>
        <circle class="centro" r="18"/>
    </g>

    <!-- Flor 3 -->
    <g class="flor flor3" transform="translate(360 120)">
        <ellipse class="petalo" rx="22" ry="42" transform="rotate(0)"/>
        <ellipse class="petalo" rx="22" ry="42" transform="rotate(60)"/>
        <ellipse class="petalo" rx="22" ry="42" transform="rotate(120)"/>
        <circle class="centro" r="18"/>
    </g>

    <!-- Flor 4 -->
    <g class="flor flor4" transform="translate(85 250)">
        <ellipse class="petalo" rx="20" ry="38" transform="rotate(0)"/>
        <ellipse class="petalo" rx="20" ry="38" transform="rotate(60)"/>
        <ellipse class="petalo" rx="20" ry="38" transform="rotate(120)"/>
        <circle class="centro" r="16"/>
    </g>

    <!-- Flor 5 -->
    <g class="flor flor5" transform="translate(420 230)">
        <ellipse class="petalo" rx="20" ry="38" transform="rotate(0)"/>
        <ellipse class="petalo" rx="20" ry="38" transform="rotate(60)"/>
        <ellipse class="petalo" rx="20" ry="38" transform="rotate(120)"/>
        <circle class="centro" r="16"/>
    </g>


    <!-- Papel del ramo -->
    <path class="papel"
          d="M170 480 L330 480 L300 570 L200 570 Z"/>

</svg>

<h1>🌼 Para ti 🌼</h1>

</div>

</body>
  </html>
