<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Un ramo para ti 💛</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #fffdf6;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    cursor: pointer;
}


/* =====================================================
   CONTENEDOR
===================================================== */

.escena {

    width: min(100vw, 600px);
    height: 100vh;

    position: relative;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =====================================================
   SVG
===================================================== */

svg {

    width: 100%;
    height: 100%;

    max-height: 850px;

    overflow: visible;
}


/* =====================================================
   EFECTO DE DIBUJAR
===================================================== */

.dibujar {

    fill: none;

    stroke: #4c913d;
    stroke-width: 5;

    stroke-linecap: round;
    stroke-linejoin: round;

    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;

    animation: dibujar 2.5s ease forwards;
}

@keyframes dibujar {

    to {
        stroke-dashoffset: 0;
    }
}


/* =====================================================
   TALLOS
===================================================== */

.tallo1 {
    animation-delay: 0.3s;
}

.tallo2 {
    animation-delay: 0.7s;
}

.tallo3 {
    animation-delay: 1.1s;
}

.tallo4 {
    animation-delay: 1.5s;
}

.tallo5 {
    animation-delay: 1.9s;
}

.tallo6 {
    animation-delay: 2.3s;
}


/* =====================================================
   HOJAS
===================================================== */

.hoja {

    fill: #6caf4e;

    stroke: #438436;
    stroke-width: 3;

    opacity: 0;

    transform-box: fill-box;
    transform-origin: center;

    animation:
        hojaAparece
        0.8s
        ease
        forwards;
}

.hoja1 {
    animation-delay: 3.0s;
}

.hoja2 {
    animation-delay: 3.3s;
}

.hoja3 {
    animation-delay: 3.6s;
}

.hoja4 {
    animation-delay: 3.9s;
}

.hoja5 {
    animation-delay: 4.2s;
}

.hoja6 {
    animation-delay: 4.5s;
}

@keyframes hojaAparece {

    0% {

        opacity: 0;

        transform:
            scale(0)
            rotate(-30deg);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.1)
            rotate(5deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);
    }
}


/* =====================================================
   FLORES
===================================================== */

.flor {

    opacity: 0;

    transform-box: fill-box;
    transform-origin: center;

    animation:
        florAparece
        1s
        ease
        forwards;
}

.flor1 {
    animation-delay: 4.8s;
}

.flor2 {
    animation-delay: 5.4s;
}

.flor3 {
    animation-delay: 6.0s;
}

.flor4 {
    animation-delay: 6.6s;
}

.flor5 {
    animation-delay: 7.2s;
}

@keyframes florAparece {

    0% {

        opacity: 0;

        transform:
            scale(0.05)
            rotate(-30deg);
    }

    60% {

        opacity: 1;

        transform:
            scale(1.08)
            rotate(5deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);
    }
}


/* =====================================================
   PÉTALOS
===================================================== */

.petalo {

    fill: #ffd83d;

    stroke: #e1a900;

    stroke-width: 2;
}


/* =====================================================
   CENTRO DE LAS FLORES
===================================================== */

.centro {

    fill: #d89500;

    stroke: #a96e00;

    stroke-width: 2;
}


/* =====================================================
   DETALLES DEL CENTRO
===================================================== */

.detalle {

    fill: #ffe87a;

    opacity: 0.9;
}


/* =====================================================
   PAPEL DEL RAMO
===================================================== */

.papel {

    opacity: 0;

    animation:
        papelAparece
        1.3s
        ease
        forwards;

    animation-delay: 8s;
}

@keyframes papelAparece {

    0% {

        opacity: 0;

        transform:
            translateY(80px)
            scale(0.8);
    }

    100% {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   MENSAJE
===================================================== */

.mensaje {

    position: absolute;

    left: 0;
    right: 0;

    bottom: 7%;

    text-align: center;

    font-size: clamp(30px, 8vw, 50px);

    color: #d79b00;

    font-weight: 500;

    opacity: 0;

    animation:
        mensajeAparece
        1.5s
        ease
        forwards;

    animation-delay: 9s;
}

@keyframes mensajeAparece {

    from {

        opacity: 0;

        transform:
            translateY(20px)
            scale(0.9);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   PEQUEÑOS DESTELLOS
===================================================== */

.brillo {

    fill: #ffd83d;

    opacity: 0;

    animation:
        brillo
        1s
        ease
        infinite alternate;
}

.brillo1 {
    animation-delay: 9.5s;
}

.brillo2 {
    animation-delay: 10s;
}

@keyframes brillo {

    from {
        opacity: 0;
        transform: scale(0.5);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


/* =====================================================
   CELULARES PEQUEÑOS
===================================================== */

@media (max-width: 450px) {

    svg {
        transform: scale(1.08);
    }

    .mensaje {
        bottom: 8%;
    }
}

</style>
</head>

<script>

/*
    Al tocar la pantalla,
    reiniciamos todas las animaciones.
*/

 document.body.addEventListener("click", () => {

    const elementos =
        document.querySelectorAll(
            ".dibujar, .hoja, .flor, .papel, .mensaje"
        );

    elementos.forEach(elemento => {

        elemento.style.animation = "none";

        elemento.offsetHeight;

        elemento.style.animation = "";

    });

});

</script>
