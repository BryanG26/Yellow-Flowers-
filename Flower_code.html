<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {

    background: #fffdf5;

    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: monospace;

    cursor: pointer;
}


/* =====================================================
   ESCENA
===================================================== */

.scene {

    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;
}


/* =====================================================
   SVG
===================================================== */

svg {

    width: min(90vw, 430px);
    height: auto;

    overflow: visible;

    image-rendering: pixelated;
}


/* =====================================================
   TALLO
===================================================== */

.stem {

    stroke: #3c9638;

    stroke-width: 9;

    stroke-linecap: square;

    fill: none;

    stroke-dasharray: 500;

    stroke-dashoffset: 500;

    animation:
        drawStem
        1.5s
        steps(20)
        forwards;

    animation-delay: 2.8s;
}

@keyframes drawStem {

    to {
        stroke-dashoffset: 0;
    }
}


/* =====================================================
   HOJAS
===================================================== */

.leaf {

    opacity: 0;

    transform-box: fill-box;
    transform-origin: center;

    animation:
        showLeaf
        0.7s
        steps(5)
        forwards;
}

.leftLeaf {
    animation-delay: 4.1s;
}

.rightLeaf {
    animation-delay: 4.5s;
}

@keyframes showLeaf {

    from {

        opacity: 0;

        transform:
            scale(0.1);
    }

    to {

        opacity: 1;

        transform:
            scale(1);
    }
}


/* =====================================================
   PÉTALOS
===================================================== */

.petal {

    opacity: 0;

    transform-box: fill-box;

    transform-origin: center;

    animation:
        showPetal
        0.45s
        steps(4)
        forwards;
}


/* Cada pétalo aparece después del anterior */

.p1  { animation-delay: 0.20s; }
.p2  { animation-delay: 0.35s; }
.p3  { animation-delay: 0.50s; }
.p4  { animation-delay: 0.65s; }
.p5  { animation-delay: 0.80s; }
.p6  { animation-delay: 0.95s; }
.p7  { animation-delay: 1.10s; }
.p8  { animation-delay: 1.25s; }
.p9  { animation-delay: 1.40s; }
.p10 { animation-delay: 1.55s; }
.p11 { animation-delay: 1.70s; }
.p12 { animation-delay: 1.85s; }

@keyframes showPetal {

    0% {

        opacity: 0;

        transform:
            scale(0.15);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.08);
    }

    100% {

        opacity: 1;

        transform:
            scale(1);
    }
}


/* =====================================================
   CENTRO
===================================================== */

.flowerCenter {

    opacity: 0;

    animation:
        showCenter
        0.7s
        steps(5)
        forwards;

    animation-delay: 2.2s;
}

@keyframes showCenter {

    from {

        opacity: 0;

        transform:
            scale(0.2);
    }

    to {

        opacity: 1;

        transform:
            scale(1);
    }
}


/* =====================================================
   MENSAJE
===================================================== */

.message {

    margin-top: -20px;

    font-size:
        clamp(28px, 8vw, 46px);

    color: #dda500;

    letter-spacing: 3px;

    opacity: 0;

    animation:
        showMessage
        1s
        ease
        forwards;

    animation-delay: 5.5s;
}

@keyframes showMessage {

    from {

        opacity: 0;

        transform:
            translateY(20px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =====================================================
   PIXEL BORDER
===================================================== */

.pixelBorder {

    stroke:
        #e2a900;

    stroke-width:
        4;

    stroke-linejoin:
        bevel;
}

</style>
</head>
