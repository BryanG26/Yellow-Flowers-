<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flor amarilla 🌼</title>

<style>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

:root {
    --pixel: 10px;

    --amarillo: #ffd21f;
    --amarillo-claro: #ffe86a;
    --amarillo-oscuro: #e9a900;

    --cafe: #9a570b;
    --cafe-claro: #bd7315;

    --verde: #398b32;
    --verde-claro: #57a947;

    --fondo: #fffdf5;
}


/* =====================================================
   PÁGINA
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: var(--fondo);

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    font-family: monospace;

    cursor: pointer;
}


/* =====================================================
   ESCENA
===================================================== */

.escena {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;
}


/* =====================================================
   FLOR
===================================================== */

.flor {
    position: relative;

    width: 300px;
    height: 500px;
}


/* =====================================================
   PIXEL BASE
===================================================== */

.pixel {
    position: absolute;

    width: var(--pixel);
    height: var(--pixel);

    opacity: 0;

    image-rendering: pixelated;
}


/* =====================================================
   CENTRO DE LA FLOR
===================================================== */

.centro {
    background: var(--cafe);

    left: 145px;
    top: 145px;

    box-shadow:

        /* fila 1 */
        10px 0 var(--cafe),
        20px 0 var(--cafe),

        /* fila 2 */
        -10px 10px var(--cafe),
        0 10px var(--cafe-claro),
        10px 10px var(--cafe),
        20px 10px var(--cafe-claro),
        30px 10px var(--cafe),

        /* fila 3 */
        -10px 20px var(--cafe),
        0 20px var(--cafe),
        10px 20px var(--cafe-claro),
        20px 20px var(--cafe),
        30px 20px var(--cafe),

        /* fila 4 */
        0 30px var(--cafe),
        10px 30px var(--cafe),
        20px 30px var(--cafe);

    animation:
        pixelCentro 0.05s steps(1) forwards;

    animation-delay: 2.7s;
}


/* =====================================================
   PÉTALOS
===================================================== */

.petalo {
    background: var(--amarillo);

    left: 145px;
    top: 145px;

    box-shadow:

        /* ===== PÉTALO SUPERIOR ===== */

        -10px -10px var(--amarillo),
        0 -20px var(--amarillo),
        10px -30px var(--amarillo),

        20px -30px var(--amarillo-claro),
        30px -20px var(--amarillo),
        40px -10px var(--amarillo),

        /* ===== PÉTALO SUPERIOR IZQUIERDO ===== */

        -20px 0 var(--amarillo),
        -30px -10px var(--amarillo),
        -40px -20px var(--amarillo),

        -40px -30px var(--amarillo),
        -30px -40px var(--amarillo-claro),
        -20px -50px var(--amarillo),

        -10px -50px var(--amarillo),

        /* ===== PÉTALO IZQUIERDO ===== */

        -30px 10px var(--amarillo),
        -40px 20px var(--amarillo),
        -50px 30px var(--amarillo),

        -50px 40px var(--amarillo-claro),
        -40px 50px var(--amarillo),
        -30px 50px var(--amarillo),

        /* ===== PÉTALO INFERIOR IZQUIERDO ===== */

        -20px 60px var(--amarillo),
        -30px 70px var(--amarillo),
        -30px 80px var(--amarillo),

        -20px 90px var(--amarillo-claro),
        -10px 90px var(--amarillo),
        0 80px var(--amarillo),

        /* ===== PÉTALO INFERIOR ===== */

        10px 70px var(--amarillo),
        20px 80px var(--amarillo),
        30px 80px var(--amarillo),

        40px 70px var(--amarillo-claro),
        40px 60px var(--amarillo),

        /* ===== PÉTALO DERECHO ===== */

        50px 50px var(--amarillo),
        60px 40px var(--amarillo),
        60px 30px var(--amarillo),

        50px 20px var(--amarillo-claro),
        40px 10px var(--amarillo),

        /* ===== PÉTALO SUPERIOR DERECHO ===== */

        50px 0 var(--amarillo),
        60px -10px var(--amarillo),
        70px -20px var(--amarillo),

        70px -30px var(--amarillo),
        60px -40px var(--amarillo-claro),
        50px -50px var(--amarillo),

        40px -50px var(--amarillo);

    animation:
        dibujarPetalos 0.06s steps(1) forwards;

    animation-delay: 0.1s;
}


/* =====================================================
   TALLO
===================================================== */

.tallo {
    background: var(--verde);

    left: 150px;
    top: 180px;

    box-shadow:

        0 10px var(--verde),
        0 20px var(--verde),
        0 30px var(--verde),
        0 40px var(--verde),
        0 50px var(--verde),
        0 60px var(--verde),
        0 70px var(--verde),
        0 80px var(--verde),
        0 90px var(--verde),
        0 100px var(--verde),
        0 110px var(--verde),
        0 120px var(--verde),
        0 130px var(--verde),
        0 140px var(--verde),
        0 150px var(--verde),
        0 160px var(--verde),
        0 170px var(--verde),
        0 180px var(--verde),
        0 190px var(--verde),
        0 200px var(--verde),
        0 210px var(--verde),
        0 220px var(--verde),
        0 230px var(--verde);

    animation:
        dibujarTallo 0.07s steps(1) forwards;

    animation-delay: 4s;
}


/* =====================================================
   HOJA IZQUIERDA
===================================================== */

.hoja-izquierda {

    background: var(--verde);

    left: 150px;
    top: 330px;

    box-shadow:

        -10px 0 var(--verde),
        -20px 10px var(--verde),
        -30px 10px var(--verde),
        -40px 20px var(--verde),

        -50px 30px var(--verde),
        -60px 40px var(--verde-claro),

        -60px 50px var(--verde),
        -50px 60px var(--verde),
        -40px 70px var(--verde),

        -30px 70px var(--verde-claro),
        -20px 60px var(--verde),

        -30px 50px var(--verde),
        -40px 40px var(--verde);

    animation:
        dibujarHoja 0.07s steps(1) forwards;

    animation-delay: 6s;
}


/* =====================================================
   HOJA DERECHA
===================================================== */

.hoja-derecha {

    background: var(--verde);

    left: 150px;
    top: 380px;

    box-shadow:

        10px 0 var(--verde),
        20px -10px var(--verde),
        30px -10px var(--verde),
        40px -20px var(--verde),

        50px -30px var(--verde),
        60px -40px var(--verde-claro),

        60px -50px var(--verde),
        50px -60px var(--verde),
        40px -70px var(--verde),

        30px -70px var(--verde-claro),
        20px -60px var(--verde),

        30px -50px var(--verde),
        40px -40px var(--verde);

    animation:
        dibujarHoja 0.07s steps(1) forwards;

    animation-delay: 7s;
}


/* =====================================================
   DESTELLOS
===================================================== */

.brillo1 {
    background: var(--amarillo);

    left: 75px;
    top: 120px;

    box-shadow:

        0 20px var(--amarillo),
        20px 10px var(--amarillo),
        -20px 10px var(--amarillo);

    animation:
        aparecerBrillo 0.5s ease forwards;

    animation-delay: 8s;
}


.brillo2 {
    background: var(--amarillo);

    left: 215px;
    top: 100px;

    box-shadow:

        0 20px var(--amarillo),
        20px 10px var(--amarillo),
        -20px 10px var(--amarillo);

    animation:
        aparecerBrillo 0.5s ease forwards;

    animation-delay: 8.3s;
}


/* =====================================================
   MENSAJE
===================================================== */

.mensaje {

    margin-top: -20px;

    font-size: clamp(25px, 7vw, 42px);

    color: #e0a400;

    opacity: 0;

    animation:
        aparecerMensaje 1s ease forwards;

    animation-delay: 8.5s;

    text-align: center;
}


.mensaje span {
    color: #f2b900;
}


/* =====================================================
   ANIMACIONES
===================================================== */

@keyframes pixelCentro {

    to {
        opacity: 1;
    }
}


@keyframes dibujarPetalos {

    0% {
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 1;
    }
}


@keyframes dibujarTallo {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


@keyframes dibujarHoja {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


@keyframes aparecerBrillo {

    from {
        opacity: 0;
        transform: scale(0);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


@keyframes aparecerMensaje {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 400px) {

    :root {
        --pixel: 8px;
    }

    .flor {
        transform: scale(0.9);
    }
}

</style>
</head>


<body>

<div class="escena">

    <div class="flor">

        <!-- Pétalos -->
        <div class="pixel petalo"></div>

        <!-- Centro -->
        <div class="pixel centro"></div>

        <!-- Tallo -->
        <div class="pixel tallo"></div>

        <!-- Hojas -->
        <div class="pixel hoja-izquierda"></div>
        <div class="pixel hoja-derecha"></div>

        <!-- Destellos -->
        <div class="pixel brillo1"></div>
        <div class="pixel brillo2"></div>

    </div>


    <div class="mensaje">
        🌼 <span>Para ti</span> 🌼
    </div>

</div>


<script>

/*
    Al tocar la pantalla se reinicia
    toda la animación.
*/

document.body.addEventListener("click", () => {

    document.body.classList.remove("reiniciar");

    void document.body.offsetWidth;

    document.body.classList.add("reiniciar");

    location.reload();

});

</script>

</body>
</html>
